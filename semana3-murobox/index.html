<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muro del Box y Semáforo F1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <!-- PARTE 1: EL MURO DEL BOX (Variables y Transiciones) -->
        <section class="muro-box">
            <h2>Telemetría en Vivo</h2>
            <div class="panel-telemetria">
                <div class="medidor_velocidad">
                    <h3>Velocidad</h3>
                    <p>312 km/h</p>
                </div>
                <div class="medidor_neumaticos">
                    <h3>Neumáticos</h3>
                    <p>95°C</p>
                </div>
                <div class="medidor_combustible">
                    <h3>Combustible</h3>
                    <p>45%</p>
                </div>
            </div>
        </section>

        <!-- PARTE 2: EL SEMÁFORO F1 (Animaciones y Keyframes) -->
        <section class="semaforo-f1">
            <h2>Luces de Salida</h2>
            <div class="luces-container">
                <div class="luz1"></div>
                <div class="luz2"></div>
                <div class="luz3"></div>
                <div class="luz4"></div>
                <div class="luz5"></div>
            </div>
            <div>
            <button class="btn-iniciar">Iniciar Carrera</button>
            </div>
        </section>
    </main>

</body>
</html>
